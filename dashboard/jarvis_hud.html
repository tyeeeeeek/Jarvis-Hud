<!--
  J.A.R.V.I.S phone HUD -- point your camera at anything and ask questions
  about what it sees, with real answers (not scripted demo lines).

  A deliberately separate page from dashboard/index.html (the Teams-style
  control panel) -- that page is intentionally "a distinct, sleeker look"
  per its own header comment; this one is the literal cyan sci-fi HUD
  replica, reachable from your phone at /hud on the same Tailscale-gated
  server, reusing the same access token (see dashboard_server.py's
  `_hud_page` route).

  State machine (see STATE constant below):
    IDLE      -- faint pulsing "JARVIS" wordmark, listening for the wake
                 phrase ("Jarvis, are you there?") or a tap.
    ACTIVE    -- camera open, live local bounding boxes (TensorFlow.js,
                 runs entirely in the browser -- ambient "I can see
                 something" flavor only, not what answers questions).
                 Ask anything, by voice or by typing into the text box --
                 anything you say/type here that isn't a stop phrase is
                 treated as a question.
    THINKING  -- one captured frame is described by Gemini
                 (vision_service.describe_scene) and handed as context to
                 the REAL Jarvis brain along with your exact question
                 (/api/hud/ask -> jarvis.py's handle_command -> the same
                 Claude tool-calling pipeline voice/Telegram/SMS use) --
                 so it can talk about what it sees AND everything else
                 Jarvis can actually do, not just answer vision questions
                 in isolation. Honest about vision being unavailable
                 (no GEMINI_API_KEY, or a failed request) rather than
                 inventing a description either way. The real answer
                 arrives async over SSE (see startStream()) and is
                 spoken back, then it's straight back to ACTIVE for the
                 next question.

  "Close camera" drops back to idle-with-mic-listening; "Jarvis, sleep"
  resets all the way to idle. Sound effects are synthesized in-browser via
  the Web Audio API (a few oscillator envelopes -- see playChirp())
  rather than shipped as .wav files, so there's nothing to license or
  host.

  Live camera mirror: whenever the camera is open (ACTIVE or THINKING),
  a small downscaled JPEG is posted to /api/hud/stream about 5x/second
  (startFrameStream/stopFrameStream below) and relayed straight to the
  desktop HUD's Vision Feed widget -- see dashboard_server.py's
  `register_frame_handler` for why that's a separate, dedicated path
  rather than the same channel /api/hud/ask's answers travel over.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<style>
  :root {
    --cyan: #00D1FF;
    --cyan-dim: rgba(0,209,255,0.25);
    --cyan-glow: rgba(0,209,255,0.55);
    --white: #eef8fc;
    --bg: #030608;
    --danger: #ff4d5e;
    --amber: #ffa64b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "JetBrains Mono", "SF Mono", "Courier New", ui-monospace, monospace;
    color: var(--white); user-select: none;
  }

  /* ---------- token gate (same scheme as the main dashboard) ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: var(--bg);
    padding: 24px; text-align: center;
  }
  #gate.hidden { display: none; }
  #gate h1 { color: var(--cyan); letter-spacing: 6px; font-size: 22px; text-shadow: 0 0 12px var(--cyan-glow); margin: 0; }
  #gate p { color: #7fa8b3; font-size: 13px; margin: 0; }
  #gate input {
    width: 100%; max-width: 300px; background: #071016; border: 1px solid var(--cyan-dim);
    color: var(--white); padding: 12px 14px; font-family: inherit; font-size: 14px; border-radius: 6px;
    outline: none;
  }
  #gate input:focus { border-color: var(--cyan); }
  #gate button {
    width: 100%; max-width: 300px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    padding: 12px; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer;
  }
  #gate button:active { background: var(--cyan-dim); }
  #gateError { color: var(--danger); font-size: 12px; min-height: 16px; }

  /* ---------- shell + grid backdrop ---------- */
  #app { position: fixed; inset: 0; display: none; flex-direction: column; }
  #gridbg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35;
    background-image:
      linear-gradient(rgba(0,209,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,209,255,0.07) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px;
  }
  #logo { color: var(--cyan); font-weight: 700; letter-spacing: 6px; font-size: 15px; text-shadow: 0 0 10px var(--cyan-glow); }
  #logo .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); margin-right: 8px; box-shadow: 0 0 8px var(--cyan-glow); animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #clock { color: var(--white); font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: 2px; opacity: 0.9; }
  #stateLabel { position: absolute; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); font-size: 9px; letter-spacing: 3px; color: var(--cyan); opacity: 0.65; transition: color 0.3s ease; }
  #app[data-state="THINKING"] #stateLabel { color: var(--amber); }

  /* ---------- camera viewport ---------- */
  #viewportWrap { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 4px 16px; min-height: 0; }
  #viewport {
    position: relative; width: 100%; max-width: 520px; aspect-ratio: 3/4; max-height: 100%;
    border-radius: 22px; overflow: hidden; background: #050b0e;
    border: 1px solid var(--cyan-dim); box-shadow: 0 0 0 1px rgba(0,209,255,0.08), 0 0 40px rgba(0,209,255,0.12) inset, 0 10px 40px rgba(0,0,0,0.6);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  #app[data-state="THINKING"] #viewport {
    border-color: rgba(255,166,75,0.5);
    box-shadow: 0 0 0 1px rgba(255,166,75,0.12), 0 0 40px rgba(255,166,75,0.18) inset, 0 10px 40px rgba(0,0,0,0.6);
  }
  .corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--cyan); opacity: 0.85; z-index: 5; transition: border-color 0.3s ease; }
  #app[data-state="THINKING"] .corner { border-color: var(--amber); }
  .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
  .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
  .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
  .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

  #camVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; background: #050b0e; }
  #camVideo.on { opacity: 1; }
  #detectCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
  #fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }

  #idleMark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--cyan); letter-spacing: 10px; font-size: 20px; opacity: 0.28; z-index: 2;
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.14} 50%{opacity:0.4} }
  #idleMark.hidden { display: none; }

  #thinkTag {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 9px; letter-spacing: 2px; color: var(--amber); background: rgba(26,16,0,0.55);
    border: 1px solid rgba(255,166,75,0.35); padding: 3px 8px; border-radius: 4px; opacity: 0; transition: opacity .2s;
  }
  #thinkTag.show { opacity: 0.9; animation: thinkTagPulse 1s ease-in-out infinite; }
  @keyframes thinkTagPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .scanline-sweep {
    position: absolute; left: 0; right: 0; height: 40%; z-index: 6;
    background: linear-gradient(180deg, transparent, rgba(0,209,255,0.22), transparent);
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep { 0%{ top: -40%; } 100%{ top: 100%; } }

  .glitch-wipe {
    position: absolute; inset: 0; z-index: 7; background: var(--cyan);
    animation: glitchwipe .32s steps(6) forwards;
  }
  @keyframes glitchwipe {
    0%   { clip-path: inset(0 0 100% 0); opacity: 0.9; }
    20%  { clip-path: inset(0 40% 40% 0); opacity: 0.75; }
    40%  { clip-path: inset(30% 0 20% 55%); opacity: 0.6; }
    60%  { clip-path: inset(60% 20% 0 0); opacity: 0.4; }
    80%  { clip-path: inset(0 0 0 0); opacity: 0.15; }
    100% { clip-path: inset(0 0 0 100%); opacity: 0; }
  }

  /* ---------- transcript / typewriter panel ---------- */
  #transcriptWrap { position: relative; z-index: 2; padding: 10px 20px 4px; min-height: 54px; }
  #transcript {
    font-size: 14px; line-height: 1.5; color: var(--white); text-shadow: 0 0 6px rgba(238,248,252,0.15);
    max-width: 560px; margin: 0 auto; text-align: center; min-height: 42px;
  }
  #transcript .cursor { display: inline-block; width: 7px; background: var(--cyan); margin-left: 2px; animation: blink 0.9s steps(2) infinite; }

  /* ---------- waveform ---------- */
  #waveWrap { position: relative; z-index: 2; display: flex; justify-content: center; padding: 2px 0 6px; }
  #waveCanvas { width: min(360px, 90vw); height: 46px; }

  /* ---------- ask-a-question text row ---------- */
  #askRow { position: relative; z-index: 2; display: flex; gap: 8px; padding: 0 16px 8px; max-width: 560px; margin: 0 auto; width: 100%; }
  #askInput {
    flex: 1; background: rgba(0,209,255,0.05); border: 1px solid var(--cyan-dim); color: var(--white);
    padding: 10px 12px; border-radius: 20px; font-family: inherit; font-size: 13px; outline: none;
  }
  #askInput:focus { border-color: var(--cyan); }
  #askInput::placeholder { color: #4f7580; }
  #askInput:disabled { opacity: 0.35; }
  #askBtn {
    background: var(--cyan-dim); border: 1px solid var(--cyan); color: var(--cyan); font-weight: 700;
    font-family: inherit; font-size: 11px; letter-spacing: 1px; padding: 0 16px; border-radius: 20px; cursor: pointer;
  }
  #askBtn:disabled { opacity: 0.3; pointer-events: none; }

  /* ---------- quick-action chips (manual fallback, mirrors SPACE-bar trigger) ---------- */
  #chips { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 16px max(14px, env(safe-area-inset-bottom)); }
  .chip {
    background: rgba(0,209,255,0.06); border: 1px solid var(--cyan-dim); color: var(--cyan);
    font-family: inherit; font-size: 10.5px; letter-spacing: 1px; padding: 9px 12px; border-radius: 20px;
    cursor: pointer; white-space: nowrap;
  }
  .chip:active { background: var(--cyan-dim); }
  .chip.primary { border-color: var(--cyan); background: var(--cyan-dim); font-weight: 700; }
  .chip.danger { border-color: rgba(255,77,94,0.5); color: var(--danger); }
  .chip[disabled] { opacity: 0.3; pointer-events: none; }

  #micHint { position: relative; z-index: 2; text-align: center; font-size: 10px; color: #4f7580; letter-spacing: 1px; padding-bottom: 4px; }
</style>
</head>
<body>

<div id="gate">
  <h1>J.A.R.V.I.S</h1>
  <p>Enter your dashboard access token</p>
  <input id="tokenInput" type="password" placeholder="access token" autocomplete="off">
  <button onclick="connect()">CONNECT</button>
  <div id="gateError"></div>
</div>

<div id="app">
  <div id="gridbg"></div>

  <div id="topbar">
    <div id="logo"><span class="dot"></span>JARVIS</div>
    <div id="stateLabel">IDLE</div>
    <div id="clock">--:--</div>
  </div>

  <div id="viewportWrap">
    <div id="viewport">
      <video id="camVideo" playsinline muted autoplay></video>
      <canvas id="detectCanvas"></canvas>
      <canvas id="fxCanvas"></canvas>
      <div id="idleMark">JARVIS</div>
      <div id="thinkTag">ANALYZING</div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </div>
  </div>

  <div id="transcriptWrap"><div id="transcript"></div></div>
  <div id="waveWrap"><canvas id="waveCanvas"></canvas></div>
  <div id="micHint">listening...</div>

  <div id="askRow">
    <input id="askInput" type="text" placeholder="type a question about what the camera sees..." disabled>
    <button id="askBtn" onclick="onAskSubmit()" disabled>ASK</button>
  </div>

  <div id="chips">
    <button class="chip primary" id="chipActivate" onclick="onChipActivate()">JARVIS, ARE YOU THERE?</button>
    <button class="chip danger" id="chipClose" onclick="onChipClose()" disabled>CLOSE CAMERA</button>
    <button class="chip danger" id="chipSleep" onclick="onChipSleep()" disabled>JARVIS, SLEEP</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
'use strict';

/* ============================== auth (shared token w/ main dashboard) ============================== */
let TOKEN = localStorage.getItem('jarvis_dashboard_token') || '';

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'}, opts.headers || {});
  return fetch(path, opts).then(r => { if (r.status === 401) throw new Error('unauthorized'); return r.json(); });
}
// Same auth as api() above, but for binary audio -- a plain <audio src="...">
// tag can't attach the Authorization header, so the real edge-tts clip is
// fetched here and played from a local blob URL instead.
function apiBlob(path) {
  return fetch(path, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(r => { if (!r.ok) throw new Error('audio fetch failed: ' + r.status); return r.blob(); });
}

function connect() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  TOKEN = t;
  api('/api/agents').then(() => {
    localStorage.setItem('jarvis_dashboard_token', TOKEN);
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display = 'flex';
    boot();
  }).catch(() => {
    document.getElementById('gateError').textContent = 'Wrong token, or dashboard unreachable.';
  });
}
if (TOKEN) {
  // Already authenticated on the main dashboard -- skip the gate.
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tokenInput').value = TOKEN;
  });
}

/* ============================== clock (?demo=1 freezes the demo start time at 23:43) ============================== */
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
let demoClock = null; // {h,m,s} once demo mode ticks from 23:43
function updateClock() {
  let h, m;
  if (DEMO) {
    if (!demoClock) demoClock = { h: 23, m: 43, s: 0 };
    demoClock.s++;
    if (demoClock.s >= 60) { demoClock.s = 0; demoClock.m++; }
    if (demoClock.m >= 60) { demoClock.m = 0; demoClock.h = (demoClock.h + 1) % 24; }
    h = demoClock.h; m = demoClock.m;
  } else {
    const now = new Date();
    h = now.getHours(); m = now.getMinutes();
  }
  document.getElementById('clock').textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
setInterval(updateClock, 1000);

/* ============================== state machine ============================== */
const STATE = { IDLE: 'IDLE', ACTIVE: 'ACTIVE', THINKING: 'THINKING' };
let state = STATE.IDLE;

const STATE_LABELS = { IDLE: 'IDLE', ACTIVE: 'CAMERA ACTIVE', THINKING: 'ANALYZING' };

function setState(s) {
  state = s;
  document.getElementById('app').setAttribute('data-state', s);
  document.getElementById('stateLabel').textContent = STATE_LABELS[s] || s;
  document.getElementById('idleMark').classList.toggle('hidden', s !== STATE.IDLE);
  document.getElementById('thinkTag').classList.toggle('show', s === STATE.THINKING);
  document.getElementById('chipActivate').disabled = s !== STATE.IDLE;
  document.getElementById('chipClose').disabled = (s === STATE.IDLE);
  document.getElementById('chipSleep').disabled = (s === STATE.IDLE);
  const askDisabled = (s !== STATE.ACTIVE);
  document.getElementById('askInput').disabled = askDisabled;
  document.getElementById('askBtn').disabled = askDisabled;
}

/* ============================== typewriter ============================== */
let typeTimer = null;
function typewriter(text, onDone) {
  clearInterval(typeTimer);
  const el = document.getElementById('transcript');
  el.innerHTML = '';
  let i = 0;
  const speed = 22;
  typeTimer = setInterval(() => {
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(typeTimer);
      if (onDone) onDone();
    }
  }, speed);
}

/* ============================== speech: TTS ============================== */
// Two paths: audioUrl (the real edge-tts clip dashboard_server.py's
// _hud_ask synthesized -- same voice the desktop assistant speaks with) is
// tried first and is what plays for every real brain answer; the browser's
// own speechSynthesis is the fallback for local-only strings that never hit
// the backend (e.g. "Camera closed, sir.") and for when edge-tts itself
// isn't installed/failed server-side, so the HUD is never silently mute.
let isSpeaking = false;
let _currentAudio = null;
function speak(text, onDone, audioUrl) {
  typewriter(text);
  if (audioUrl) {
    apiBlob(audioUrl).then(blob => {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      _currentAudio = audio;
      isSpeaking = true;
      const finish = (cb) => { isSpeaking = false; URL.revokeObjectURL(url); if (_currentAudio === audio) _currentAudio = null; if (cb) cb(); };
      audio.onended = () => finish(onDone);
      audio.onerror = () => finish(() => speakBrowserTts(text, onDone));
      audio.play().catch(() => finish(() => speakBrowserTts(text, onDone)));
    }).catch(() => speakBrowserTts(text, onDone));
    return;
  }
  speakBrowserTts(text, onDone);
}
function speakBrowserTts(text, onDone) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 0.85; u.volume = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /male|david|daniel|google uk english male/i.test(v.name));
    if (preferred) u.voice = preferred;
    u.onstart = () => { isSpeaking = true; };
    u.onend = () => { isSpeaking = false; if (onDone) onDone(); };
    u.onerror = () => { isSpeaking = false; if (onDone) onDone(); };
    window.speechSynthesis.speak(u);
  } catch (e) { isSpeaking = false; if (onDone) onDone(); }
}

/* ============================== speech: STT (wake phrase + questions) ============================== */
let recognizer = null;
let wantListening = false;

function normalize(s) { return (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function heard(transcript, phrases) {
  const n = normalize(transcript);
  return phrases.some(p => n.includes(p));
}

// Mobile browsers (Android Chrome especially) are notorious for silently
// killing a "continuous" SpeechRecognition session -- after backgrounding
// the tab, a network hiccup, or just a while of no speech -- without
// always firing `onend`. When that happens the mic looks like it's still
// listening but nothing you say gets any response at all. The fixes
// below: track whether a session is actually running (`recognizerActive`),
// restart on a short delay rather than synchronously (avoids
// "recognition service busy" errors from an instant restart), and a
// watchdog that notices and force-restarts if it's been marked inactive
// for too long -- a safety net for exactly the "no onend fired" case.
let recognizerActive = false;
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('micHint').textContent = 'voice recognition not supported on this browser -- use the buttons/text box below'; return; }
  wantListening = true;
  _startRecognizer();
  setInterval(() => { if (wantListening && !recognizerActive) _startRecognizer(); }, 8000);
}

function _startRecognizer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognizer = new SR();
  recognizer.continuous = true;
  recognizer.interimResults = false;
  recognizer.lang = 'en-US';
  recognizer.onstart = () => {
    recognizerActive = true;
    document.getElementById('micHint').textContent = 'listening...';
  };
  recognizer.onresult = (e) => {
    const res = e.results[e.results.length - 1];
    if (!res.isFinal) return;
    handleUtterance(res[0].transcript);
  };
  recognizer.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantListening = false;
      document.getElementById('micHint').textContent = 'microphone permission denied -- use the buttons/text box below';
    }
    // 'no-speech' / 'aborted' / transient network errors are normal and
    // self-heal via onend's restart below -- nothing to do here.
  };
  recognizer.onend = () => {
    recognizerActive = false;
    if (wantListening) setTimeout(() => { if (wantListening && !recognizerActive) _startRecognizer(); }, 300);
  };
  try { recognizer.start(); } catch (e) { /* a start already in flight -- that attempt's onstart/onend settles it */ }
}

// A question heard while THINKING (still waiting on the previous answer)
// is queued rather than silently dropped -- see handleAnswer() below,
// which fires it automatically the moment the current answer finishes
// speaking. Every recognized question gets answered, none go missing.
let pendingQuestion = null;
function handleUtterance(transcript) {
  const n = normalize(transcript);
  if (state === STATE.IDLE) {
    if (heard(n, ['jarvis are you there', 'jarvis you there', 'are you there jarvis'])) doActivate();
    return;
  }
  if (heard(n, ['jarvis sleep', 'go to sleep'])) { doSleep(); return; }
  if (heard(n, ['close camera', 'close the camera', 'stop camera'])) { doCloseCamera(); return; }
  if (state === STATE.ACTIVE) { askQuestion(transcript); return; }
  if (state === STATE.THINKING) { pendingQuestion = transcript; }
}

/* ============================== sound effects (synthesized -- no external files) ============================== */
let actx = null;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, start, dur, type, gainPeak) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, actx.currentTime + start);
  gain.gain.setValueAtTime(0, actx.currentTime + start);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.18, actx.currentTime + start + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + start + dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(actx.currentTime + start);
  osc.stop(actx.currentTime + start + dur + 0.05);
}
function playChirp(kind) {
  if (!actx) return;
  if (kind === 'bloop') { tone(520, 0, 0.09, 'sine'); tone(880, 0.09, 0.14, 'sine'); }
  else if (kind === 'scan') { tone(300, 0, 0.05, 'sawtooth', 0.08); tone(1400, 0.03, 0.12, 'sine', 0.08); tone(300, 0.13, 0.05, 'sawtooth', 0.06); }
  else if (kind === 'confirm') { tone(660, 0, 0.09, 'triangle'); tone(880, 0.07, 0.09, 'triangle'); tone(1320, 0.14, 0.16, 'triangle'); }
}

/* ============================== waveform ============================== */
const waveCanvas = document.getElementById('waveCanvas');
const waveCtx = waveCanvas.getContext('2d');
let micAnalyser = null, micData = null;
function sizeWaveCanvas() {
  const r = waveCanvas.getBoundingClientRect();
  waveCanvas.width = r.width * devicePixelRatio; waveCanvas.height = r.height * devicePixelRatio;
}
function drawWave() {
  sizeWaveCanvasIfNeeded();
  const w = waveCanvas.width, h = waveCanvas.height;
  waveCtx.clearRect(0, 0, w, h);
  const bars = 28;
  const gap = w / bars;
  waveCtx.fillStyle = (state === STATE.THINKING) ? '#ffa64b' : '#00D1FF';
  for (let i = 0; i < bars; i++) {
    let amp;
    if (state === STATE.THINKING) {
      amp = 0.3 + 0.5 * Math.abs(Math.sin(i * 1.1 + Date.now() / 160));
    } else if (isSpeaking) {
      amp = (0.25 + 0.65 * Math.abs(Math.sin(i * 0.9 + Date.now() / 130))) * (0.6 + 0.4 * Math.sin(Date.now() / 400 + i));
    } else if (micAnalyser && micData) {
      micAnalyser.getByteFrequencyData(micData);
      const idx = Math.floor((i / bars) * micData.length);
      amp = micData[idx] / 255;
    } else {
      amp = 0.06 + 0.03 * Math.sin(Date.now() / 900 + i);
    }
    const barH = Math.max(2, amp * h);
    waveCtx.globalAlpha = 0.55 + 0.45 * amp;
    waveCtx.fillRect(i * gap + gap * 0.25, (h - barH) / 2, gap * 0.5, barH);
  }
  requestAnimationFrame(drawWave);
}
let _lastWaveSize = 0;
function sizeWaveCanvasIfNeeded() {
  const r = waveCanvas.getBoundingClientRect();
  const target = Math.round(r.width * devicePixelRatio);
  if (target !== _lastWaveSize) { sizeWaveCanvas(); _lastWaveSize = target; }
}
requestAnimationFrame(drawWave);

async function setupMicMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream);
    micAnalyser = actx.createAnalyser();
    micAnalyser.fftSize = 64;
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    src.connect(micAnalyser);
  } catch (e) { /* mic meter is cosmetic only -- STT still works without it */ }
}

/* ============================== camera + live local detection (ambient only) ============================== */
const video = document.getElementById('camVideo');
const detectCanvas = document.getElementById('detectCanvas');
const detectCtx = detectCanvas.getContext('2d');
let camStream = null;
let cocoModel = null;
let detectLoopHandle = null;

async function ensureModel() {
  if (cocoModel) return cocoModel;
  document.getElementById('micHint').textContent = 'loading local vision model...';
  cocoModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
  document.getElementById('micHint').textContent = 'listening...';
  return cocoModel;
}

function sizeDetectCanvas() {
  const r = video.getBoundingClientRect();
  detectCanvas.width = r.width * devicePixelRatio; detectCanvas.height = r.height * devicePixelRatio;
  document.getElementById('fxCanvas').width = detectCanvas.width;
  document.getElementById('fxCanvas').height = detectCanvas.height;
}
window.addEventListener('resize', sizeDetectCanvas);

async function startCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false,
    });
  } catch (e) {
    try { camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
    catch (e2) { typewriter('Camera unavailable: ' + e2.message); return false; }
  }
  video.srcObject = camStream;
  await video.play().catch(() => {});
  video.classList.add('on');
  sizeDetectCanvas();
  return true;
}

function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  video.classList.remove('on');
  if (detectLoopHandle) { cancelAnimationFrame(detectLoopHandle); detectLoopHandle = null; }
  detectCtx.clearRect(0, 0, detectCanvas.width, detectCanvas.height);
}

async function detectLoop() {
  if (state === STATE.IDLE) return;
  if (cocoModel && video.readyState >= 2) {
    let predictions = [];
    try { predictions = await cocoModel.detect(video); } catch (e) { predictions = []; }
    renderDetections(predictions);
  }
  detectLoopHandle = requestAnimationFrame(() => setTimeout(detectLoop, 120)); // ~8fps, kind to phone battery
}

function renderDetections(predictions) {
  const w = detectCanvas.width, h = detectCanvas.height;
  detectCtx.clearRect(0, 0, w, h);
  if (!video.videoWidth) return;
  const scaleX = w / video.videoWidth, scaleY = h / video.videoHeight;
  const color = (state === STATE.THINKING) ? '#ffa64b' : '#00D1FF';
  predictions.slice(0, 4).forEach(p => {
    if (p.score < 0.5) return;
    const [x, y, bw, bh] = p.bbox;
    const rx = x * scaleX, ry = y * scaleY, rw = bw * scaleX, rh = bh * scaleY;
    detectCtx.strokeStyle = color;
    detectCtx.lineWidth = 2;
    detectCtx.shadowColor = color; detectCtx.shadowBlur = 6;
    detectCtx.strokeRect(rx, ry, rw, rh);
    const tag = p.class.toUpperCase() + '  ' + Math.round(p.score * 100) + '%';
    detectCtx.font = '600 11px monospace';
    const tw = detectCtx.measureText(tag).width + 12;
    detectCtx.fillStyle = 'rgba(0,20,26,0.75)';
    detectCtx.fillRect(rx, Math.max(0, ry - 20), tw, 18);
    detectCtx.shadowBlur = 0;
    detectCtx.fillStyle = color;
    detectCtx.fillText(tag, rx + 6, Math.max(14, ry - 6));
  });
}

// maxDim downscales the longer side before encoding -- full resolution
// for /api/hud/ask (accuracy matters for real answers), a small capped
// size for the desktop live-mirror stream below (bandwidth/battery
// matter more there than detail, and it's just a "what am I looking at"
// glance, not something anyone reads text off of).
function captureFrameB64(maxDim, quality) {
  return new Promise(resolve => {
    try {
      let w = video.videoWidth, h = video.videoHeight;
      if (maxDim && Math.max(w, h) > maxDim) {
        const scale = maxDim / Math.max(w, h);
        w = Math.round(w * scale); h = Math.round(h * scale);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(video, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality || 0.75));
    } catch (e) { resolve(null); }
  });
}

/* ============================== live camera mirror -> desktop HUD ============================== */
// Fire-and-forget, ~5fps while the phone camera is open -- see
// dashboard_server.py's `_hud_stream` route for why this is a separate,
// dedicated relay rather than going through the same channel as vision Q&A.
let streamTimer = null;
function startFrameStream() {
  if (streamTimer) return;
  streamTimer = setInterval(() => {
    if (state === STATE.IDLE) return;
    captureFrameB64(480, 0.55).then(b64 => {
      if (!b64) return;
      api('/api/hud/stream', { method: 'POST', body: JSON.stringify({ image: b64 }) }).catch(() => {});
    });
  }, 200);
}
function stopFrameStream() {
  if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
  // Tell the desktop the feed just went dark, so it clears immediately
  // instead of showing a frozen last frame.
  api('/api/hud/stream', { method: 'POST', body: JSON.stringify({ image: null }) }).catch(() => {});
}

/* ============================== hand-gesture cursor (desktop widget control) ============================== */
// MediaPipe Hands, running entirely in this browser -- tracks one hand
// and reports a normalized cursor position + pinch state to the desktop
// HUD (dashboard_server.py's /api/hud/gesture -> jarvis.py's
// _on_hand_gesture -> ArcReactor.tsx's 'hand_gesture' WS handling) so you
// can grab and drag desktop widgets by pinching, using the phone's camera
// instead of a mouse. A separate model from coco-ssd's object detection
// above; both run locally, no frames leave the phone for this.
let handsModel = null;
let gestureLoopHandle = null;
let lastGestureSend = 0;
const GESTURE_SEND_INTERVAL = 80; // ~12/sec -- a tiny JSON payload, so this can run faster than the frame mirror

function ensureHandsModel() {
  if (handsModel) return handsModel;
  handsModel = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
  handsModel.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  handsModel.onResults(onHandResults);
  return handsModel;
}

function onHandResults(results) {
  const now = Date.now();
  if (now - lastGestureSend < GESTURE_SEND_INTERVAL) return;
  lastGestureSend = now;

  const hand = results.multiHandLandmarks && results.multiHandLandmarks[0];
  if (!hand) {
    api('/api/hud/gesture', { method: 'POST', body: JSON.stringify({ active: false }) }).catch(() => {});
    return;
  }

  // Palm center -- the average of the wrist plus the four base-knuckle
  // landmarks -- tracks far more stably frame-to-frame than any single
  // fingertip point would.
  const palmIdx = [0, 5, 9, 13, 17];
  let px = 0, py = 0;
  palmIdx.forEach(i => { px += hand[i].x; py += hand[i].y; });
  px /= palmIdx.length; py /= palmIdx.length;

  // Pinch: thumb-tip(4)-to-index-tip(8) distance, normalized against a
  // wrist-to-middle-knuckle scale reference so the threshold holds
  // regardless of how close the hand is to the camera.
  const scale = Math.hypot(hand[9].x - hand[0].x, hand[9].y - hand[0].y) || 0.001;
  const pinchDist = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y) / scale;
  const pinching = pinchDist < 0.55;

  // Mirror X for a natural "move hand right, cursor moves right" feel --
  // MediaPipe reports raw (unmirrored) camera coordinates.
  api('/api/hud/gesture', {
    method: 'POST',
    body: JSON.stringify({ x: 1 - px, y: py, pinching, active: true }),
  }).catch(() => {});
}

function startGestureLoop() {
  if (gestureLoopHandle) return;
  ensureHandsModel();
  const step = async () => {
    if (state === STATE.IDLE) { gestureLoopHandle = null; return; }
    try { await handsModel.send({ image: video }); } catch (e) {}
    gestureLoopHandle = setTimeout(step, 80);
  };
  step();
}
function stopGestureLoop() {
  if (gestureLoopHandle) { clearTimeout(gestureLoopHandle); gestureLoopHandle = null; }
  api('/api/hud/gesture', { method: 'POST', body: JSON.stringify({ active: false }) }).catch(() => {});
}

/* ============================== state transitions ============================== */
function fxWipe() {
  const div = document.createElement('div');
  div.className = 'glitch-wipe';
  document.getElementById('viewport').appendChild(div);
  setTimeout(() => div.remove(), 400);
  const sweep = document.createElement('div');
  sweep.className = 'scanline-sweep';
  document.getElementById('viewport').appendChild(sweep);
  setTimeout(() => sweep.remove(), 1700);
}

async function doActivate() {
  if (state !== STATE.IDLE) return;
  unlockAudio();
  playChirp('bloop');
  setupMicMeter();
  typewriter('Opening camera...');
  const ok = await startCamera();
  if (!ok) { speak("I couldn't access the camera, sir -- check the permission prompt."); return; }
  fxWipe();
  setState(STATE.ACTIVE);
  ensureModel().then(() => detectLoop());
  startFrameStream();
  startGestureLoop();
  speak('Online. Ask me anything about what I see.');
}
function onChipActivate() { doActivate(); }

// The real answer no longer comes back in the HTTP response -- /api/hud/ask
// just queues the request (frame description + question, handed to the
// real Jarvis brain) and returns immediately; the actual reply arrives
// later over the SSE 'chat_reply' event (see startStream() below), same
// as every other channel that talks to the brain. askTimeoutId is a
// safety net: if that event never comes back (brain hung, dropped
// connection, ...) this makes sure THINKING doesn't get stuck forever
// with no response at all.
let askTimeoutId = null;
function askQuestion(question) {
  if (state !== STATE.ACTIVE) return;
  question = (question || '').trim();
  if (!question) return;
  setState(STATE.THINKING);
  playChirp('scan');
  typewriter(question + ' ...');
  clearTimeout(askTimeoutId);
  // 55s: describe_scene retries once server-side (up to ~20s x2 worst
  // case) before the brain even starts working the actual question, so
  // this needs real headroom above that or it fires before a perfectly
  // healthy slow request would've finished on its own.
  askTimeoutId = setTimeout(() => {
    if (state === STATE.THINKING) {
      handleAnswer("That's taking longer than expected, sir -- still working on it. Try again in a moment.");
    }
  }, 55000);
  captureFrameB64().then(b64 => {
    if (!b64) { handleAnswer("I couldn't grab a frame just now, sir."); return; }
    api('/api/hud/ask', { method: 'POST', body: JSON.stringify({ image: b64, question }) })
      .catch(() => handleAnswer("I couldn't reach Jarvis just now, sir."));
  });
}
function handleAnswer(answer, audioUrl) {
  if (state !== STATE.THINKING) return; // already answered (e.g. the timeout already fired) -- ignore a late/duplicate arrival
  clearTimeout(askTimeoutId);
  playChirp('confirm');
  setState(STATE.ACTIVE);
  speak(answer || "I didn't get a usable answer that time, sir.", () => {
    // A question heard while this one was still being answered (see
    // handleUtterance's THINKING branch) -- ask it now instead of having
    // silently dropped it.
    if (pendingQuestion) {
      const q = pendingQuestion;
      pendingQuestion = null;
      askQuestion(q);
    }
  }, audioUrl);
}
function onAskSubmit() {
  const input = document.getElementById('askInput');
  const q = input.value;
  input.value = '';
  askQuestion(q);
}
document.getElementById('askInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') onAskSubmit();
});

function doCloseCamera() {
  if (state === STATE.IDLE) return;
  stopCamera();
  stopFrameStream();
  stopGestureLoop();
  pendingQuestion = null;
  setState(STATE.IDLE);
  speak('Camera closed, sir.');
}
function onChipClose() { doCloseCamera(); }

function doSleep() {
  if (state === STATE.IDLE) return;
  stopCamera();
  stopFrameStream();
  stopGestureLoop();
  pendingQuestion = null;
  setState(STATE.IDLE);
  speak('Going to sleep.', () => { document.getElementById('transcript').textContent = ''; });
}
function onChipSleep() { doSleep(); }

/* ============================== brain (real Claude tool-calling backend) ============================== */
// /api/hud/ask answers arrive here, not in that POST's response -- see
// its own comment in dashboard_server.py for why (an LLM/tool-calling
// call can take a few seconds, so it's queued and answered async).
let sseSource = null;
function startStream() {
  if (sseSource) return;
  sseSource = new EventSource('/api/stream?token=' + encodeURIComponent(TOKEN));
  sseSource.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.type === 'chat_reply' && ev.payload && ev.payload.bot === 'jarvis') {
        if (state === STATE.THINKING) handleAnswer(ev.payload.text, ev.payload.audio_url);
        else speak(ev.payload.text, null, ev.payload.audio_url); // arrived after our own timeout already spoke a fallback -- still worth saying
      }
    } catch (err) {}
  };
}

/* ============================== keyboard fallback (desktop testing -- SPACE = "Jarvis, are you there?") ============================== */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && state === STATE.IDLE && document.activeElement !== document.getElementById('askInput')) {
    e.preventDefault(); doActivate();
  }
});

/* ============================== boot ============================== */
function boot() {
  setState(STATE.IDLE);
  updateClock();
  startListening();
  startStream();
  document.getElementById('viewport').addEventListener('click', unlockAudio, { once: true });
}
</script>
</body>
</html>
